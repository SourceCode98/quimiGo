# Blueprint de Render para la API de QuimicaLearn (plan gratuito). La base de datos es MongoDB Atlas (plan M0 gratuito).
# En Render: New > Blueprint > elige este repositorio. Te pedirá MONGODB_URI (la cadena de conexión de Atlas).
services:
  - type: web
    name: quimicalearn-api
    runtime: node
    plan: free
    region: ohio
    rootDir: api
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
