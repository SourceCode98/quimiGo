# Blueprint de Render para QuimicaLearn: API (Node) + base de datos PostgreSQL, ambas en plan gratuito.
# En Render: New > Blueprint > elige este repositorio. No pide ningún valor: todo se configura solo.
databases:
  - name: quimicalearn-db
    plan: free
    region: ohio
    databaseName: quimicalearn
    user: quimicalearn

services:
  - type: web
    name: quimicalearn-api
    runtime: node
    plan: free
    region: ohio
    rootDir: api
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: quimicalearn-db
          property: connectionString
